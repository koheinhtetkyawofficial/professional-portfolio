# IMPORTANT: Set up a working GitHub OAuth proxy before using /admin/.
# Never put GitHub client secrets in this public file.

# Portfolio CMS Configuration

backend:
  name: github
  repo: koheinhtetkyawofficial/professional-portfolio
  branch: main
  base_url: https://portfolio-oauth.koheinhtetkyawofficial.workers.dev
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads

publish: false

collections:
  - name: projects
    label: Portfolio Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Category, name: category, widget: select, options: ["F&B Operations", "Sales & Marketing", "Digital Marketing", "Creative Work"]}
      - {label: Summary, name: summary, widget: text}
      - {label: Date or Label, name: date, widget: string, required: false}
      - {label: Cover Image, name: image, widget: image, required: false}
      - {label: Featured, name: featured, widget: boolean, default: false}
      - {label: Case Study, name: body, widget: markdown}

  - name: experience
    label: Work Experience
    folder: src/content/experience
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Job Title, name: title, widget: string}
      - {label: Company, name: company, widget: string}
      - {label: Period, name: period, widget: string}
      - {label: Category, name: category, widget: string}
      - {label: Display Order, name: order, widget: number, default: 0, value_type: int}
      - {label: Responsibilities and Achievements, name: body, widget: markdown}

  - name: services
    label: Services
    folder: src/content/services
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Service Name, name: title, widget: string}
      - {label: Summary, name: summary, widget: text}
      - {label: Display Order, name: order, widget: number, default: 0, value_type: int}
      - {label: Details, name: body, widget: markdown}
      
  - name: settings
    label: Website Settings
    files:
      - name: profile
        label: Personal Profile
        file: src/data/profile.json
        fields:
          - {label: Your Name, name: name, widget: string}
          - {label: Browser Page Title, name: pageTitle, widget: string}
          - {label: Hero Eyebrow, name: eyebrow, widget: string}
          - {label: Hero Heading, name: heroTitle, widget: string}
          - {label: Hero Highlight, name: heroHighlight, widget: string}
          - {label: Hero Description, name: heroDescription, widget: text}
          - {label: About Heading, name: aboutTitle, widget: string}
          - {label: About Highlight, name: aboutHighlight, widget: string}
          - {label: About Me, name: aboutText, widget: text}
          - {label: About Note, name: aboutNote, widget: text}
          - {label: Email Address, name: email, widget: string}
          - {label: Contact Description, name: contactText, widget: text}
          - {label: Profile Photo, name: profilePhoto, widget: image, required: false}



